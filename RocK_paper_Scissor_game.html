    <p>Rock paer Scissor game via button</p>

        <button onclick = "
            const random_number = Math.random();
            let computer_move = ``;

            if (  0 <= random_number && random_number < 1/3) {
                computer_move = `Rock`;
            }
            else if ( 1/3 <= random_number && random_number < 2/3) {
                computer_move = `Paper`;
            }
            else if ( 2/3 <= random_number && random_number <= 1) {
                computer_move = `Scissor`;
            }

            let result = ``;

            if (computer_move === 'Rock') {
                result = `Tie`;
            }
            else if (computer_move === `Paper`) {
                result = `Loose`;
            }
            else {
                result = 'Win';
            }


        console.log(`You picked up Rock and the computer move is ${computer_move} and you ${result}`);
        alert(`You picked up Rock and the computer move is ${computer_move} and you ${result}`);

        ">Rock</button>
