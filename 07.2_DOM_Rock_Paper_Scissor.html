<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
</head>

<body>
    
    <p>Rock paer Scissor game via button</p>

        <button onclick = "
            Player_Game('Rock');
        ">Rock</button>

        <!--------------------------------------------------------> 

        <button onclick = "
            Player_Game('Paper');
        ">Paper</button>

        <!--------------------------------------------------------> 

        <button onclick = "
            Player_Game('Scissor');
        ">Scissor</button>

        <p class = 'js-score'></p>   <!-- This is the line where the para changes--> 

        <p style="color: brown;font-size: xx-large;" class = 'js-moves'></p> <!-- This is the line where the para changes--> 

        <p class = 'js-result'></p> <!-- This is the line where the para changes--> 

        <button onclick = "
            score.wins = 0;
            score.lose = 0;
            score.tie = 0;
            localStorage.removeItem('score');

            update_score_element();    // this works for the reset score in the para

            // alert(`The Score is Reseted`);
            console.log(`The Score is Reseted`);

        ">Reset</button>

    <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
            wins : 0,
            lose : 0,
            tie : 0
        };
/*
        if (!score) {    ## this also works but by using the default OR operator
            score = {
                wins : 0,
                lose : 0,
                tie : 0
            };
        }

*/
        
        function Player_Game(Player_Move) {
            const Computer_Move = Computer_Move_1();

            let result = ``;

                if (Player_Move === 'Scissor') {
                    if (Computer_Move === 'Rock') {
                    result = `Loose`;
                    }
                    else if (Computer_Move === `Paper`) {
                    result = `Win`;
                    }
                    else {
                    result = 'Tie';
                    }
                }

                else if (Player_Move === 'Paper') {

                    if (Computer_Move === 'Rock') {
                        result = `Win`;
                    }
                    else if (Computer_Move === `Paper`) {
                        result = `Tie`;
                    }
                    else {
                        result = 'Loose';
                    }
                }

                else {
                    if (Computer_Move === 'Rock') {
                        result = `Tie`;
                    }
                    else if (Computer_Move === `Paper`) {
                        result = `Loose`;
                    }
                    else {
                        result = 'Win';
                    }
                }

                if (result === 'Win') {
                    score.wins += 1;
                }
                else if (result === 'Loose') {
                    score.lose += 1;
                }
                else if (result === 'Tie') {
                    score.tie += 1;
                };

                localStorage.setItem('score',JSON.stringify(score));  // this will store the points in the local storage

                update_score_element();  // this is the line where the para changes=]

                document.querySelector('.js-moves').innerHTML = `You picked up ${Player_Move} and the computer move is ${Computer_Move}`; // this will change the para and give in moves of player and computer 

                document.querySelector('.js-result').innerHTML = result;  // this will change the para and return in the result form

 
            console.log(`You picked up ${Player_Move} and the computer move is ${Computer_Move} and you ${result} and the score is Wins : ${score.wins}  ||  loose : ${score.lose}  ||  tie : ${score.tie}`);
            // alert(`You picked up Scissor and the computer move is ${Computer_Move} and you ${result}  and the score is Wins : ${score.wins}  ||  loose : ${score.lose}  ||  tie : ${score.tie}`);
        }


        function update_score_element() {    // this is the line where the para changes
            document.querySelector('.js-score')
                .innerHTML = `Wins : ${score.wins}, loose : ${score.lose}, tie : ${score.tie}`;
        }

        function Computer_Move_1() {

            let Computer_Move = '';

            const random_number = Math.random();

                if (  0 <= random_number && random_number < 1/3) {
                    Computer_Move = `Rock`;
                }
                else if ( 1/3 <= random_number && random_number < 2/3) {
                    Computer_Move = `Paper`;
                }
                else if ( 2/3 <= random_number && random_number <= 1) {
                    Computer_Move = `Scissor`;
                }

        return Computer_Move;
        }
    </script>


</body>

</html>
